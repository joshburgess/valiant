# CI: build and test each package independently.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_GHC: '9.10.3'
  CABAL_VERSION: '3.12'

jobs:
  # ── Build (matrixed across supported GHC versions) ────────────────
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.6.7', '9.8.4', '9.10.3']
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - name: Pin GHC in cabal.project.local
        run: echo "with-compiler: ghc-${{ matrix.ghc }}" > cabal.project.local
      - name: Drop cabal.project.freeze for non-primary GHC
        # The freeze file pins versions resolved against the primary GHC
        # (e.g. text-2.1 is incompatible with GHC 9.6's bundled text-2.0).
        # For matrix GHCs, let the solver pick fresh versions.
        if: matrix.ghc != env.PRIMARY_GHC
        run: rm -f cabal.project.freeze
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ci-${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project', '**/*.cabal') }}
          restore-keys: ci-${{ runner.os }}-${{ matrix.ghc }}-
      - name: Build all packages
        run: |
          cabal update
          cabal build pg-wire valiant valiant-plugin valiant-cli
          cabal build valiant-mtl valiant-effectful valiant-bluefin valiant-fused-effects
          cabal build valiant-conduit valiant-streaming valiant-streamly valiant-pipes
      - uses: actions/cache/save@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ci-${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}

  # ── Unit tests (no database needed) ───────────────────────────────
  # Each suite runs across the full GHC matrix to catch version-specific
  # regressions in pg-wire, the runtime, the CLI, and the plugin.
  unit-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.6.7', '9.8.4', '9.10.3']
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - name: Pin GHC in cabal.project.local
        run: echo "with-compiler: ghc-${{ matrix.ghc }}" > cabal.project.local
      - name: Drop cabal.project.freeze for non-primary GHC
        # The freeze file pins versions resolved against the primary GHC
        # (e.g. text-2.1 is incompatible with GHC 9.6's bundled text-2.0).
        # For matrix GHCs, let the solver pick fresh versions.
        if: matrix.ghc != env.PRIMARY_GHC
        run: rm -f cabal.project.freeze
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ci-${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}
          restore-keys: ci-${{ runner.os }}-${{ matrix.ghc }}-
      - run: cabal test pg-wire-test
      - run: cabal test valiant-test
      - run: cabal test valiant-cli-test
      - run: cabal test valiant-plugin-test

  # ── Plugin end-to-end (compile-time SQL validation) ──────────────
  # The e2e suite GHC-compiles fixture modules with the Valiant plugin
  # loaded against the committed .valiant/ cache and sql/ fixtures.
  # No database is needed: the cache is pre-generated.
  test-plugin-e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.PRIMARY_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ci-${{ runner.os }}-${{ env.PRIMARY_GHC }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}
          restore-keys: ci-${{ runner.os }}-${{ env.PRIMARY_GHC }}-
      - run: cabal test valiant-plugin-e2e

  # ── Integration tests (need Postgres) ─────────────────────────────
  test-integration:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.PRIMARY_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ci-${{ runner.os }}-${{ env.PRIMARY_GHC }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}
          restore-keys: ci-${{ runner.os }}-${{ env.PRIMARY_GHC }}-
      - name: Setup Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER valiant_test WITH PASSWORD 'valiant_test' SUPERUSER;"
          sudo -u postgres psql -c "CREATE DATABASE valiant_test OWNER valiant_test;"
          PG_HBA=$(sudo -u postgres psql -t -c "SHOW hba_file;" | xargs)
          sudo sed -i '1s/^/local all all trust\n/' "$PG_HBA"
          sudo systemctl reload postgresql
      - name: Run integration tests
        env:
          DATABASE_URL: postgres://valiant_test:valiant_test@/valiant_test?host=/var/run/postgresql
        run: |
          cabal test valiant-integration
          # Adapter suites whose cursor/fold paths hit the real DB.
          # These were previously not wired into CI, which let a
          # binary-format cursor bug survive in the streaming adapters
          # for months (it only surfaced when a dev set DATABASE_URL
          # locally and ran them by hand).
          cabal test valiant-bluefin-test
          cabal test valiant-effectful-test
          cabal test valiant-fused-effects-test
          cabal test valiant-mtl-test
          cabal test valiant-conduit-test
          cabal test valiant-pipes-test
          cabal test valiant-streaming-test
          cabal test valiant-streamly-test

  # ── HLint ─────────────────────────────────────────────────────────
  hlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/hlint-setup@v2
        with:
          version: '3.10'
      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["runtime/src/", "wire/src/", "plugin/src/", "src/", "adapters/"]'
          fail-on: warning
