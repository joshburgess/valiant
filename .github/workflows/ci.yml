# CI: build and test each package independently.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_GHC: '9.10.3'
  CABAL_VERSION: '3.12'

jobs:
  # ── Build ─────────────────────────────────────────────────────────
  # v0.1.0.0 is single-GHC. The plugin's GHC API usage tracks 9.10's
  # parsed-AST extension fields and renamer error API; restoring
  # 9.6/9.8 support is a 0.1.x task that needs CPP shims.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.PRIMARY_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ci-${{ runner.os }}-${{ env.PRIMARY_GHC }}-${{ hashFiles('cabal.project', '**/*.cabal') }}
          restore-keys: ci-${{ runner.os }}-${{ env.PRIMARY_GHC }}-
      - name: Build all packages
        run: |
          cabal update
          cabal build pg-wire valiant valiant-plugin valiant-cli
          cabal build valiant-mtl valiant-effectful valiant-bluefin valiant-fused-effects
          cabal build valiant-conduit valiant-streaming valiant-streamly valiant-pipes
      - uses: actions/cache/save@v5
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ci-${{ runner.os }}-${{ env.PRIMARY_GHC }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}

  # ── Unit tests (no database needed) ───────────────────────────────
  unit-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.PRIMARY_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ci-${{ runner.os }}-${{ env.PRIMARY_GHC }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}
          restore-keys: ci-${{ runner.os }}-${{ env.PRIMARY_GHC }}-
      - run: cabal test pg-wire-test
      - run: cabal test valiant-test
      - run: cabal test valiant-cli-test
      - run: cabal test valiant-plugin-test

  # ── Plugin end-to-end (compile-time SQL validation) ──────────────
  # The e2e suite GHC-compiles fixture modules with the Valiant plugin
  # loaded against the committed .valiant/ cache and sql/ fixtures.
  # No database is needed: the cache is pre-generated.
  test-plugin-e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.PRIMARY_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ci-${{ runner.os }}-${{ env.PRIMARY_GHC }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}
          restore-keys: ci-${{ runner.os }}-${{ env.PRIMARY_GHC }}-
      - run: cabal test valiant-plugin-e2e

  # ── Integration tests (need Postgres) ─────────────────────────────
  test-integration:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.PRIMARY_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ci-${{ runner.os }}-${{ env.PRIMARY_GHC }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}
          restore-keys: ci-${{ runner.os }}-${{ env.PRIMARY_GHC }}-
      - name: Setup Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER valiant_test WITH PASSWORD 'valiant_test' SUPERUSER;"
          sudo -u postgres psql -c "CREATE DATABASE valiant_test OWNER valiant_test;"
          PG_HBA=$(sudo -u postgres psql -t -c "SHOW hba_file;" | xargs)
          sudo sed -i '1s/^/local all all trust\n/' "$PG_HBA"
          sudo systemctl reload postgresql
      - name: Run integration tests
        env:
          DATABASE_URL: postgres://valiant_test:valiant_test@/valiant_test?host=/var/run/postgresql
        run: |
          cabal test valiant-integration
          # Adapter suites whose cursor/fold paths hit the real DB.
          # These were previously not wired into CI, which let a
          # binary-format cursor bug survive in the streaming adapters
          # for months (it only surfaced when a dev set DATABASE_URL
          # locally and ran them by hand).
          cabal test valiant-bluefin-test
          cabal test valiant-effectful-test
          cabal test valiant-fused-effects-test
          cabal test valiant-mtl-test
          cabal test valiant-conduit-test
          cabal test valiant-pipes-test
          cabal test valiant-streaming-test
          cabal test valiant-streamly-test

  # ── Hackage hygiene ───────────────────────────────────────────────
  # Run `cabal check` in each publishable package and verify `cabal sdist`
  # produces a tarball. Catches metadata regressions (missing bounds,
  # missing category/maintainer, absent README) before they reach a
  # release branch.
  cabal-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.PRIMARY_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - name: cabal check + sdist (publishable packages only)
        # `cabal sdist all` would also produce tarballs for the vendored
        # `deps/entropy` and the `valiant-example` sample, neither of
        # which we publish. Iterate the publishable list explicitly.
        run: |
          set -e
          cabal update
          for pkg in pg-wire valiant valiant-plugin valiant-cli \
                     valiant-bluefin valiant-conduit valiant-effectful \
                     valiant-fused-effects valiant-mtl valiant-pipes \
                     valiant-streaming valiant-streamly; do
            echo "=== cabal check ($pkg) ==="
            case "$pkg" in
              valiant-cli)        dir=. ;;
              pg-wire)            dir=wire ;;
              valiant)            dir=runtime ;;
              valiant-plugin)     dir=plugin ;;
              valiant-*)          dir="adapters/$pkg" ;;
            esac
            (cd "$dir" && cabal check)
            echo "=== cabal sdist ($pkg) ==="
            # Use the pkg: target prefix so the package "valiant" is not
            # mistaken for the executable target named "valiant" defined
            # in valiant-cli.
            cabal sdist "pkg:$pkg"
          done

  # ── Haddock build (catches malformed haddock pre-Hackage) ─────────
  # Runs `cabal haddock --haddock-for-hackage` against every publishable
  # package. Hackage rebuilds haddock on its own infrastructure, but if
  # that build fails the package page shows "Documentation: not yet
  # available" and won't link types/sources properly. Catching this
  # before upload is much cheaper than re-uploading a corrected version.
  haddock:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.PRIMARY_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ci-${{ runner.os }}-${{ env.PRIMARY_GHC }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}
          restore-keys: ci-${{ runner.os }}-${{ env.PRIMARY_GHC }}-
      - name: Build haddock for every publishable package
        run: |
          set -e
          cabal update
          # --haddock-for-hackage exercises the same generation path
          # Hackage uses, including hyperlinked source rendering. Anything
          # that compiles but produces malformed haddock will fail here.
          for pkg in pg-wire valiant valiant-plugin valiant-cli \
                     valiant-bluefin valiant-conduit valiant-effectful \
                     valiant-fused-effects valiant-mtl valiant-pipes \
                     valiant-streaming valiant-streamly; do
            echo "=== cabal haddock ($pkg) ==="
            cabal haddock "pkg:$pkg" --haddock-for-hackage
          done

  # ── HLint ─────────────────────────────────────────────────────────
  # haskell-actions/hlint-setup and hlint-run are still on Node 20 in
  # their v2 release. The default branch has been updated to Node 24
  # but no v3 tag exists yet. Until upstream cuts a release, GitHub
  # will surface a Node 20 deprecation warning here. The deadline is
  # September 2026, so revisit if no v3 has shipped by mid-2026.
  hlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: haskell-actions/hlint-setup@v2
        with:
          version: '3.10'
      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["runtime/src/", "wire/src/", "plugin/src/", "src/", "adapters/"]'
          fail-on: warning
