# Benchmark suite on Linux with native Postgres (Unix socket).
#
# Runs on ubuntu-24.04 with Postgres 16 installed via apt — no Docker,
# no TCP overhead, no NAT bridge. Unix socket at /var/run/postgresql/.
#
# Split into separate jobs to avoid timeouts. Jobs share the cabal
# cache but run independently. Use mode to select which to run.

name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark mode: all | codec | query | concurrent | pool | asyncpg-compare | asyncpg-hsqlx | asyncpg-baseline | comparative | quick'
        required: false
        default: 'all'

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  GHC_VERSION: '9.10.3'
  CABAL_VERSION: '3.12'

jobs:
  # ── Build (shared by all benchmark jobs) ──────────────────────────
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: bench-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal') }}
          restore-keys: bench-${{ runner.os }}-${{ env.GHC_VERSION }}-
      - name: Build benchmarks
        run: |
          cabal update
          cabal build hsqlx-bench bench-compare -O2
      - name: Save build artifacts
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: bench-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}

  # ── Postgres setup (reusable step definition) ─────────────────────
  # Each job sets up its own Postgres since jobs run on separate runners.

  # ── Codec benchmarks (no DB needed) ──────────────────────────────
  codec:
    needs: build
    if: contains(fromJSON('["all", "codec", "quick"]'), github.event.inputs.mode || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: bench-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}
          restore-keys: bench-${{ runner.os }}-${{ env.GHC_VERSION }}-
      - name: Run codec benchmarks
        run: |
          cabal bench hsqlx-bench --benchmark-options='--match prefix codec --time-limit 3 --csv codec.csv' 2>&1 | tee codec-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-codec
          path: |
            codec.csv
            codec-output.txt

  # ── Query benchmarks ─────────────────────────────────────────────
  query:
    needs: build
    if: contains(fromJSON('["all", "query", "quick"]'), github.event.inputs.mode || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: bench-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}
          restore-keys: bench-${{ runner.os }}-${{ env.GHC_VERSION }}-
      - name: Setup Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER hsqlx_test WITH PASSWORD 'hsqlx_test' SUPERUSER;"
          sudo -u postgres psql -c "CREATE DATABASE hsqlx_test OWNER hsqlx_test;"
          PG_HBA=$(sudo -u postgres psql -t -c "SHOW hba_file;" | xargs)
          sudo sed -i '1s/^/local all all trust\n/' "$PG_HBA"
          sudo -u postgres psql -c "ALTER SYSTEM SET synchronous_commit = 'off';"
          sudo -u postgres psql -c "ALTER SYSTEM SET fsync = 'off';"
          sudo systemctl restart postgresql
      - name: Run query benchmarks
        env:
          DATABASE_URL: postgres://hsqlx_test:hsqlx_test@/hsqlx_test?host=/var/run/postgresql
        run: |
          cabal bench hsqlx-bench --benchmark-options='--match prefix query --time-limit 3 --csv query.csv' 2>&1 | tee query-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-query
          path: |
            query.csv
            query-output.txt

  # ── Concurrent benchmarks ────────────────────────────────────────
  concurrent:
    needs: build
    if: contains(fromJSON('["all", "concurrent"]'), github.event.inputs.mode || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: bench-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}
          restore-keys: bench-${{ runner.os }}-${{ env.GHC_VERSION }}-
      - name: Setup Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER hsqlx_test WITH PASSWORD 'hsqlx_test' SUPERUSER;"
          sudo -u postgres psql -c "CREATE DATABASE hsqlx_test OWNER hsqlx_test;"
          PG_HBA=$(sudo -u postgres psql -t -c "SHOW hba_file;" | xargs)
          sudo sed -i '1s/^/local all all trust\n/' "$PG_HBA"
          sudo -u postgres psql -c "ALTER SYSTEM SET synchronous_commit = 'off';"
          sudo -u postgres psql -c "ALTER SYSTEM SET fsync = 'off';"
          sudo -u postgres psql -c "ALTER SYSTEM SET max_connections = '200';"
          sudo systemctl restart postgresql
      - name: Run concurrent benchmarks
        env:
          DATABASE_URL: postgres://hsqlx_test:hsqlx_test@/hsqlx_test?host=/var/run/postgresql
        run: |
          cabal bench hsqlx-bench --benchmark-options='+RTS -N -RTS --match prefix concurrent --time-limit 2 --csv concurrent.csv' 2>&1 | tee concurrent-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-concurrent
          path: |
            concurrent.csv
            concurrent-output.txt

  # ── Pool benchmarks ──────────────────────────────────────────────
  pool:
    needs: build
    if: contains(fromJSON('["all", "pool"]'), github.event.inputs.mode || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: bench-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}
          restore-keys: bench-${{ runner.os }}-${{ env.GHC_VERSION }}-
      - name: Setup Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER hsqlx_test WITH PASSWORD 'hsqlx_test' SUPERUSER;"
          sudo -u postgres psql -c "CREATE DATABASE hsqlx_test OWNER hsqlx_test;"
          PG_HBA=$(sudo -u postgres psql -t -c "SHOW hba_file;" | xargs)
          sudo sed -i '1s/^/local all all trust\n/' "$PG_HBA"
          sudo -u postgres psql -c "ALTER SYSTEM SET synchronous_commit = 'off';"
          sudo -u postgres psql -c "ALTER SYSTEM SET fsync = 'off';"
          sudo -u postgres psql -c "ALTER SYSTEM SET max_connections = '200';"
          sudo systemctl restart postgresql
      - name: Run pool benchmarks
        env:
          DATABASE_URL: postgres://hsqlx_test:hsqlx_test@/hsqlx_test?host=/var/run/postgresql
        run: |
          cabal bench hsqlx-bench --benchmark-options='+RTS -N -RTS --match prefix pool --time-limit 2 --csv pool.csv' 2>&1 | tee pool-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-pool
          path: |
            pool.csv
            pool-output.txt

  # ── asyncpg-hsqlx benchmarks (hsqlx, same query patterns) ────────
  asyncpg-hsqlx:
    needs: build
    if: contains(fromJSON('["all", "asyncpg-compare", "asyncpg-hsqlx"]'), github.event.inputs.mode || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: bench-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}
          restore-keys: bench-${{ runner.os }}-${{ env.GHC_VERSION }}-
      - name: Setup Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER hsqlx_test WITH PASSWORD 'hsqlx_test' SUPERUSER;"
          sudo -u postgres psql -c "CREATE DATABASE hsqlx_test OWNER hsqlx_test;"
          PG_HBA=$(sudo -u postgres psql -t -c "SHOW hba_file;" | xargs)
          sudo sed -i '1s/^/local all all trust\n/' "$PG_HBA"
          sudo -u postgres psql -c "ALTER SYSTEM SET synchronous_commit = 'off';"
          sudo -u postgres psql -c "ALTER SYSTEM SET fsync = 'off';"
          sudo -u postgres psql -c "ALTER SYSTEM SET max_connections = '200';"
          sudo systemctl restart postgresql
      - name: Run asyncpg-hsqlx benchmarks (hsqlx)
        env:
          DATABASE_URL: postgres://hsqlx_test:hsqlx_test@/hsqlx_test?host=/var/run/postgresql
        run: |
          cabal bench hsqlx-bench --benchmark-options='+RTS -N -RTS --match prefix asyncpg-compare --time-limit 5 --csv asyncpg-compare.csv' 2>&1 | tee asyncpg-compare-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-asyncpg-hsqlx
          path: |
            asyncpg-compare.csv
            asyncpg-compare-output.txt

  # ── Comparative benchmarks (vs hasql, pg-simple, persistent) ─────
  comparative:
    needs: build
    if: contains(fromJSON('["all", "comparative"]'), github.event.inputs.mode || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: bench-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal') }}-${{ github.sha }}
          restore-keys: bench-${{ runner.os }}-${{ env.GHC_VERSION }}-
      - name: Setup Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 libpq-dev
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER hsqlx_test WITH PASSWORD 'hsqlx_test' SUPERUSER;"
          sudo -u postgres psql -c "CREATE DATABASE hsqlx_test OWNER hsqlx_test;"
          PG_HBA=$(sudo -u postgres psql -t -c "SHOW hba_file;" | xargs)
          sudo sed -i '1s/^/local all all trust\n/' "$PG_HBA"
          sudo -u postgres psql -c "ALTER SYSTEM SET synchronous_commit = 'off';"
          sudo -u postgres psql -c "ALTER SYSTEM SET fsync = 'off';"
          sudo systemctl restart postgresql
      - name: Run comparative benchmarks
        env:
          DATABASE_URL: postgres://hsqlx_test:hsqlx_test@/hsqlx_test?host=/var/run/postgresql
        run: |
          BENCH_MODE=quick cabal run bench-compare -- --time-limit 3 --csv comparative.csv 2>&1 | tee comparative-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-comparative
          path: |
            comparative.csv
            comparative-output.txt

  # ── asyncpg (Python) head-to-head on same machine ────────────────
  asyncpg-baseline:
    needs: build
    if: contains(fromJSON('["all", "asyncpg-compare", "asyncpg-baseline"]'), github.event.inputs.mode || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER hsqlx_test WITH PASSWORD 'hsqlx_test' SUPERUSER;"
          sudo -u postgres psql -c "CREATE DATABASE hsqlx_test OWNER hsqlx_test;"
          PG_HBA=$(sudo -u postgres psql -t -c "SHOW hba_file;" | xargs)
          sudo sed -i '1s/^/local all all trust\n/' "$PG_HBA"
          sudo -u postgres psql -c "ALTER SYSTEM SET synchronous_commit = 'off';"
          sudo -u postgres psql -c "ALTER SYSTEM SET fsync = 'off';"
          sudo -u postgres psql -c "ALTER SYSTEM SET max_connections = '200';"
          sudo systemctl restart postgresql
      - name: Install Python + asyncpg + uvloop
        run: |
          sudo apt-get install -y -qq python3 python3-pip
          pip3 install --break-system-packages asyncpg uvloop
      - name: Run asyncpg benchmarks
        env:
          DATABASE_URL: postgres://hsqlx_test@/hsqlx_test?host=/var/run/postgresql
        run: |
          python3 bench-compare/asyncpg-bench.py "$DATABASE_URL" 2>&1 | tee asyncpg-baseline-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-asyncpg-baseline
          path: asyncpg-baseline-output.txt

  # ── Summary ──────────────────────────────────────────────────────
  summary:
    needs: [codec, query, concurrent, pool, asyncpg-hsqlx, asyncpg-baseline, comparative]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          merge-multiple: true
      - name: Generate summary
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Runner:** ubuntu-24.04 (4-core x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "**Connection:** Unix socket" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in *-output.txt; do
            if [ -f "$f" ]; then
              echo "### $(basename "$f" -output.txt)" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -E "^benchmarking|^time" "$f" >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-all
          path: "*.csv"
          retention-days: 90
