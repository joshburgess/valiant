# docker-compose.yml — Postgres for valiant tests and benchmarks.
#
# Usage:
#   docker compose up -d
#   export DATABASE_URL="postgres://valiant_test:valiant_test@localhost:5433/valiant_test"
#   cabal test valiant-integration
#   cabal bench valiant-bench -- +RTS -N -RTS
#   docker compose down
#
# Or use the helper script:
#   eval $(scripts/pg-setup.sh)

services:
  postgres:
    image: postgres:16-alpine
    container_name: valiant-test-pg
    ports:
      - "${VALIANT_TEST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: valiant_test
      POSTGRES_PASSWORD: valiant_test
      POSTGRES_DB: valiant_test
    # Tuned for benchmark throughput, not durability
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=64MB
      - -c
      - synchronous_commit=off
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=200
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valiant_test"]
      interval: 1s
      timeout: 5s
      retries: 30
