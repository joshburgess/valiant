# HLint configuration for valiant
# Run: hlint runtime/src/ wire/src/ plugin/src/ src/ adapters/

# ── Hint groups ─────────────────────────────────────────────────────
- group: {name: future, enabled: true}   # pure over return, etc.

# ── Language extensions for parsing ─────────────────────────────────
- arguments: [-XOverloadedStrings, -XLambdaCase]

# ── Globally ignored hints ──────────────────────────────────────────
# Style opinions that we disagree with or that conflict with our conventions
- ignore: {name: "Use newtype instead of data"}   # data is intentional for future extension
- ignore: {name: "Reduce duplication"}             # too subjective, left to code review
- ignore: {name: "Parse error"}                    # false positive on CPP/PatternSynonyms

# `Use head` would push us toward a partial function. We ban head outright
# below; the right fix at any `args !! 0` site is an explicit pattern match
# or `listToMaybe`, not `head`.
- ignore: {name: "Use head"}

# ── Custom hints: prefer total functions ───────────────────────────
# When you want "the first element if any," reach for listToMaybe, not
# head. When you want "the first element and the rest," use uncons or
# pattern match.
- warn: {lhs: "head x", rhs: "Data.Maybe.listToMaybe x", name: "Avoid partial head — use listToMaybe"}
- warn: {lhs: "T.head x", rhs: "fst <$> Data.Text.uncons x", name: "Avoid partial T.head — use T.uncons"}

# ── Module-scoped ignores ───────────────────────────────────────────
# Performance-critical modules: don't change evaluation semantics
- ignore: {name: "Eta reduce", within: [Valiant.Transaction, Valiant.Execute, Valiant.FromRow, Valiant.FromRowFast]}
- ignore: {name: "Avoid lambda", within: [PgWire.Pool, PgWire.Wire, PgWire.MockServer, PgWire.Async, PgWire.Connection.Config]}
- ignore: {name: "Use fewer imports", within: [PgWire.Wire]}

# ── Restricted functions (banned globally) ──────────────────────────
# These should never appear in committed code
- functions:
  # Debug functions
  - {name: trace, within: [], message: "Remove debug trace"}
  - {name: traceShow, within: [], message: "Remove debug traceShow"}
  - {name: traceShowId, within: [], message: "Remove debug traceShowId"}
  - {name: traceM, within: [], message: "Remove debug traceM"}

  # Partial functions: forbidden in committed code. If you need "the first
  # element if any" use listToMaybe; if you need "head and tail" use uncons
  # or a pattern match. NonEmpty.head/last/tail/init are total and fine.
  - {name: "Prelude.head",       within: [], message: "Use Data.Maybe.listToMaybe, Data.List.NonEmpty.head, or pattern match"}
  - {name: "Data.List.head",     within: [], message: "Use Data.Maybe.listToMaybe, Data.List.NonEmpty.head, or pattern match"}
  - {name: "Prelude.tail",       within: [], message: "Use Data.List.uncons, Data.List.NonEmpty.tail, or pattern match"}
  - {name: "Data.List.tail",     within: [], message: "Use Data.List.uncons, Data.List.NonEmpty.tail, or pattern match"}
  - {name: "Prelude.init",       within: [], message: "Use Data.List.NonEmpty.init or pattern match"}
  - {name: "Data.List.init",     within: [], message: "Use Data.List.NonEmpty.init or pattern match"}
  - {name: "Prelude.last",       within: [], message: "Use Data.List.NonEmpty.last or pattern match"}
  - {name: "Data.List.last",     within: [], message: "Use Data.List.NonEmpty.last or pattern match"}
  - {name: "Prelude.!!",         within: [], message: "Use Data.List.lookup, Data.Vector.(!?), or pattern match"}
  - {name: "Data.List.!!",       within: [], message: "Use Data.List.lookup, Data.Vector.(!?), or pattern match"}
  - {name: "Data.Maybe.fromJust", within: [], message: "Use pattern match or fromMaybe with a sensible default"}
  - {name: "Prelude.read",       within: [], message: "Use Text.Read.readMaybe — read crashes on parse failure"}
  # `error` is reserved for true invariant violations. Allowed in:
  #   - Valiant.NamedParams: ill-formed compile-time SQL
  #   - Valiant.Statement: plugin placeholder shims that should never be called
  #     at runtime (the plugin rewrites them away at compile time)
  #   - Valiant.FromRowFast: decoder invariants (column index out of range,
  #     unexpected NULL after schema check)
  #   - PgWire.Pool: initialization placeholder for IORef holding the reaper
  #     thread before it's spawned
  #   - Valiant.CLI.Describe: top-level CLI command failure path
  #   - TestSupport / Main: adapter test bootstrap (DATABASE_URL missing fails
  #     loudly so CI/operator notices)
  - {name: "Prelude.error",      within: [Valiant.NamedParams, Valiant.Statement, Valiant.FromRowFast, PgWire.Pool, Valiant.CLI.Describe, TestSupport, Main], message: "Use throwPgWire or Either; reserve error for true invariant violations"}

  # nub is O(n^2); the safe-and-fast alternative is nubOrd from containers
  - {name: "Data.List.nub", within: [Valiant.CLI.Discover, Valiant.CLI.Command.Generate], message: "Use Data.Containers.ListUtils.nubOrd — Data.List.nub is O(n^2)"}

  # Unsafe functions (allowed only in specific modules)
  - {name: unsafePerformIO, within: [Valiant.Streaming, Valiant.Binary.Inet, PgWire.Async, Valiant.Conduit, Valiant.Pipes, Valiant.Stream, Valiant.Streamly, Valiant.Transaction, BenchQuery, BenchConcurrent, BenchPool, BenchAsyncpgCompare]}
  - {name: unsafeCoerce, within: []}

# ── Import alias consistency ────────────────────────────────────────
- modules:
  - {name: [Data.Map, Data.Map.Strict], as: Map}
  - {name: [Data.Set], as: Set}
  - {name: [Data.Text], as: T}
  - {name: [Data.ByteString], as: BS}
  - {name: [Data.ByteString.Char8], as: BS8}
  - {name: [Data.ByteString.Lazy], as: LBS}
  - {name: [Data.Vector], as: V}

# ── Custom hints ────────────────────────────────────────────────────
- warn: {lhs: return, rhs: pure, name: "Use pure instead of return"}
